name: Build EBKCore
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Build with Gradle
        run: gradle build
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: EBKCore-Jar
          path: build/libs/*.jar
