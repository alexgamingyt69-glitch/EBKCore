buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
apply plugin: 'forge'
apply plugin: 'org.spongepowered.mixin'

version = '1.0.0'
group = 'dev.ebk'
archivesBaseName = 'EBKCore'

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

mixin {
    add sourceSets.main, 'mixins.ebkcore.refmap.json'
}

repositories {
    maven { url = 'https://maven.moonsworth.com/repository/lunarclient-public/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    compileOnly 'com.lunarclient:apollo-protos:1.0.0'
    compileOnly 'com.google.protobuf:protobuf-java:3.25.0'
}